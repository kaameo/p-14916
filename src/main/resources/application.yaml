spring:
  application:
    name: back
  autoconfigure:
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
  config:
    import: optional:file:.env[.properties]
  servlet:
    encoding:
      force-response: true # SSE 응답 Content-Type에 charset=UTF-8을 붙여 브라우저에서 한글이 안 깨지게 한다
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/${DATABASE_NAME:vectordb}
    username: ${DATABASE_USERNAME:vector}
    password: ${DATABASE_PASSWORD:vector123}
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always # SPRING_AI_CHAT_MEMORY 테이블 자동 생성 (내장 DB가 아니어도)
    openai:
      api-key: ${OPENAI_API_KEY:sk-dummy} # 키가 없어도 기동은 되게 기본값을 둔다 (실제 호출 시 401)
      embedding:
        model: text-embedding-3-small # 기본값(ada-002)은 차원 축소(dimensions)를 지원하지 않는다
        dimensions: 384
